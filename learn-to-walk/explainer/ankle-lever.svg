<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 284" role="img" aria-labelledby="title desc" font-family="Georgia, serif" font-size="15">
  <title id="title">The Achilles tendon turns the ankle</title>
  <desc id="desc">The calf pulls upward through the Achilles tendon. The pull passes behind the ankle joint, creating torque. At push-off the forefoot presses against the ground as the heel rises.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#973e30"/>
    </marker>
  </defs>
  <rect width="420" height="284" rx="5" fill="#f2ebe0"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M42 226H375" stroke="#867d70" stroke-dasharray="2 5"/>
    <path d="M182 27c-1 38-4 91-1 124l6 18" stroke="#bcb09e" stroke-width="11"/>
    <path d="M155 30c-13 8-20 23-20 43 0 22 12 39 12 53 13-16 24-42 23-63-1-17-6-29-15-33Z" fill="#e3b4a6" stroke="#974b3e" stroke-width="1.5"/>
    <path d="M147 126v53" stroke="#7b5145" stroke-width="4"/>
    <path d="M147 179c-8 5-14 14-9 20 5 5 18 5 33 5 31 2 54 14 81 20l54 2c9-3 10-12 0-17l-33-9c-29-8-60-25-83-34l-15 13Z" fill="#fcfaf6" stroke="#51473d" stroke-width="1.7"/>
    <path d="M147 178V132" stroke="#973e30" stroke-width="2.6" marker-end="url(#arrow)"/>
    <path d="M147 166h35" stroke="#973e30" stroke-width="1.3" stroke-dasharray="3 4"/>
    <circle cx="187" cy="166" r="5" fill="#fcfaf6" stroke="#51473d" stroke-width="2"/>
    <path d="M210 139a35 35 0 0 1 12 38" stroke="#973e30" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M120 68h10m64 94 41-49h13" stroke="#867d70"/>
  </g>
  <g fill="#3f3830">
    <text x="50" y="73">Calf muscle</text>
    <text x="253" y="117">Ankle joint</text>
    <text x="290" y="247">Ground</text>
    <text x="49" y="251">Turning effect = pull × offset</text>
  </g>
  <g fill="#973e30">
    <text x="53" y="147">Tendon pull</text>
    <text x="153" y="157" font-size="13">offset</text>
    <text x="232" y="158">Turns foot</text>
  </g>
</svg>
